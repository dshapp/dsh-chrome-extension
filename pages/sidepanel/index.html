<!DOCTYPE html>
<html lang="zh" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepseek Harness APP</title>
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/foundation.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/conversation.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/tools.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/composer.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/trajectory.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/management.css">
  <link rel="stylesheet" href="../../src/app/sidepanel/styles/automations.css">
  <link rel="stylesheet" href="../../src/features/onboarding/setup-guide.css">
  <!-- KaTeX 样式(MIT,vendor 自 katex@0.16)。样式表静态引入而脚本按需异步加载:
       CSS 只有 24KB 且必须与公式同帧就位,否则会闪一下无样式的公式;
       268KB 的脚本则由 katex-loader 在首次遇到公式时才拉。 -->
  <link rel="stylesheet" href="../../src/vendor/katex/katex.min.css">
</head>
<body>

  <!-- ── Header(会话标题 + 当前会话的动作靠左,新建会话在最右) ──
       设置入口不在顶栏:它在左侧会话抽屉的底部(#history-settings-btn)。 -->
  <div id="header">
    <!-- 会话列表入口:就是原来那颗带标题的按钮,位于顶栏最左,并且现在拉开的是
         左侧抽屉而不是顶部下拉 —— 所以前导图标用 panel-left,不再是向下的 chevron。 -->
    <button id="hdr-title-wrap" type="button" aria-haspopup="dialog" aria-expanded="false"
            aria-controls="session-drawer">
      <!-- lucide: panel-left -->
      <svg class="hdr-entry-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M9 3v18"/>
      </svg>
      <!-- "工作目录 / 会话标题"。两段分别由 workspace-menu 与会话抽屉写入,
           所以拆成两个 span —— 合成一个字符串会让两个写入方互相覆盖。
           分隔符是 CSS ::after 画的,目录名为空时随前缀一起隐藏。 -->
      <span id="hdr-workspace-prefix"></span>
      <span id="hdr-title">New Chat</span>
      <kbd class="shortcut-hint" id="shortcut-history" aria-hidden="true"></kbd>
    </button>
    <!-- 当前会话的动作(子代理 / 后台任务 / Git / 打开工作目录)紧跟在标题之后,
         不再被推到右端 —— 它们说的都是"这个会话",应当和标题挨在一起。 -->
    <!-- 子代理目录入口:对齐 Mac SubagentCatalogAction —— 有子代理后代的会话才显示 -->
    <button class="hdr-btn" id="subagent-catalog-btn" type="button" popovertarget="subagent-catalog-menu" hidden aria-haspopup="dialog">
      <span class="subagent-dot" aria-hidden="true"></span>
      <span class="subagent-label"></span>
    </button>
    <!-- 后台任务入口:对齐 Mac JobListAction —— 与子代理入口同排(工具栏),
         有任务才显示;触发钮只报计数,明细在浮层里,不再塞进上下文统计浮层。 -->
    <button class="hdr-btn" id="jobs-btn" type="button" popovertarget="jobs-menu" hidden aria-haspopup="dialog">
      <span class="jobs-dot" aria-hidden="true"></span>
      <span class="jobs-label"></span>
    </button>
    <!-- Git 入口:对齐 Mac WorkspaceGitAction —— 位置也一致(紧挨在"打开工作目录"之前)。
         默认 hidden:只有当前工作目录确实是 git 仓库、且宿主代理可用时才出现;
         非仓库连图标都不画(Mac 注释:入口的全部内容都是 git 状态)。 -->
    <button class="hdr-btn" id="git-entry-btn" type="button" popovertarget="git-entry-menu" hidden aria-haspopup="dialog">
      <span class="git-entry-icon" aria-hidden="true"></span>
      <span class="git-entry-text">
        <span class="git-entry-branch"></span>
        <span class="git-entry-stat" hidden>
          <span class="git-entry-added"></span><span class="git-entry-removed"></span>
        </span>
      </span>
    </button>
    <button class="hdr-btn" id="hdr-open-folder" type="button" aria-label="打开工作目录" title="用系统打开工作目录">
      <!-- lucide: folder-open -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/>
      </svg>
    </button>
    <!-- 会话动作之后的弹性空白:把连接状态点与新建会话推到最右。 -->
    <span class="hdr-spacer" aria-hidden="true"></span>
    <!-- 连接状态点:平时不显示,只有连接中/断开才现身。放在最右侧、
         新建会话之前,这样它出现与否都不会把标题与会话动作顶开。 -->
    <div id="hdr-status" title=""></div>
    <!-- 新建会话:顶栏最右(原设置入口的位置)。 -->
    <button class="hdr-btn" id="hdr-new" aria-label="New Chat" title="新建会话">
      <!-- lucide: square-plus -->
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M8 12h8"/>
        <path d="M12 8v8"/>
      </svg>
      <kbd class="shortcut-hint" id="shortcut-new" aria-hidden="true"></kbd>
    </button>
  </div>

  <!-- 工作目录菜单:新建会话页的 hero chip 打开它(决定下一个会话建在哪)。
       留在 body 层而不是任何会被 display:none 的容器里 —— 否则容器没展开时
       整棵子树都不渲染,chip 点了就毫无反应。 -->
  <div id="workspace-menu" popover="auto" aria-label="Workspace"></div>

  <!-- 子代理目录树 popover(随 chip 打开) -->
  <div id="subagent-catalog-menu" popover="auto" aria-label="子代理会话"></div>
  <div id="jobs-menu" popover="auto" aria-label="后台任务"></div>
  <div id="git-entry-menu" popover="auto" aria-label="Git 分支"></div>

  <!-- ── 主区域 ── -->
  <div id="main">

    <!-- 首次使用引导:本机还没装好 dsh / dsh-chrome-control 时由 setup-guide.js
         渲染,占据消息区与输入区的位置(见 setup-guide.css 的 body.setup-required)。 -->
    <div id="setup-guide" role="region" aria-labelledby="setup-guide-title" hidden></div>

    <!-- 消息区 -->
    <div id="messages">
      <!-- 会话内查找(⌘F):sticky 在消息区顶部,内容由 find-in-chat 填充标记。
           data-find-skip 让查找条自身不参与搜索。 -->
      <div id="find-bar" hidden role="search" data-find-skip>
        <input id="find-input" type="text" placeholder="在会话中查找…" aria-label="在会话中查找" autocomplete="off" spellcheck="false" />
        <span id="find-count" aria-live="polite"></span>
        <button id="find-prev" type="button" aria-label="上一个匹配" title="上一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m18 15-6-6-6 6"/></svg></button>
        <button id="find-next" type="button" aria-label="下一个匹配" title="下一个"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
        <button id="find-close" type="button" aria-label="关闭查找" title="关闭"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
      </div>
      <div id="empty-hint">
        <div class="empty-lede">
          <b id="empty-title">开始对话</b>
          <!-- 新建会话的选择区:工作目录 + Agent 预设(对齐 Mac EmptyHero 的 chip 行)。
               两者都是"下一个会话用什么"的暂存选择,所以只在空会话时出现。 -->
          <div class="hero-chips">
            <button class="hero-chip" id="hero-workspace" type="button" popovertarget="workspace-menu"
                    aria-label="Workspace" title="切换工作目录">
              <!-- lucide: folder -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
              </svg>
              <!-- 首帧默认值:未选工作目录时新会话落在宿主分配的临时目录,
                   挂载后由 workspace-menu 的 paint() 按当前选择覆盖。 -->
              <span id="hero-workspace-label">临时目录</span>
              <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <button class="hero-chip" id="preset-btn" type="button" popovertarget="preset-menu" hidden>
              <!-- lucide: layers -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/>
                <path d="M2 12.18a1 1 0 0 0 .6.92l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 .6-.93"/>
              </svg>
              <span id="preset-label">—</span>
              <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
          </div>
          <div id="preset-menu" popover="auto" aria-label="Agent 预设"></div>
        </div>
      </div>
      <!-- 切会话时的历史加载态(转圈 + 骨架屏),由 session-loading.js 填充;
           历史到达前占住消息区,避免先闪一片空白或「开始对话」空态。 -->
      <div id="session-loading" hidden></div>
      <div id="msg-list"></div>
      <div id="interactions"></div>

      <!-- 轨迹页(对话列内切换,composer 仍可用)。入口在统计浮层底部的"查看轨迹"。
           工具栏:轮次/调用折叠、搜索、关闭;台账由 trajectory-view 渲染。 -->
      <div id="trajectory-pane" hidden>
        <div class="trajectory-toolbar" role="toolbar" aria-label="轨迹">
          <button class="trajectory-toggle" data-action="turns" type="button">轮次</button>
          <button class="trajectory-toggle" data-action="calls" type="button">调用</button>
          <button class="trajectory-toggle trajectory-timeline-mode" type="button" aria-pressed="false">顺序</button>
          <div class="trajectory-search">
            <input id="trajectory-search" type="search" placeholder="搜索轨迹…" aria-label="搜索轨迹" autocomplete="off" spellcheck="false" />
            <button class="trajectory-search-clear" type="button" aria-label="清空搜索" hidden><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <button class="trajectory-close" type="button" aria-label="关闭轨迹"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
        </div>
        <section id="trajectory-timeline" class="trajectory-timeline" aria-label="轨迹时间线">
          <div class="trajectory-timeline-plot">
            <div class="trajectory-timeline-labels" aria-hidden="true">
              <span></span><span></span><span></span>
            </div>
            <div class="trajectory-timeline-track">
              <button class="trajectory-timeline-earlier" type="button" hidden>…</button>
              <div class="trajectory-timeline-lanes"></div>
              <div class="trajectory-timeline-boundaries" aria-hidden="true"></div>
              <div class="trajectory-timeline-selection" hidden aria-hidden="true"></div>
              <div class="trajectory-timeline-hover-line" hidden aria-hidden="true"></div>
              <div class="trajectory-timeline-tooltip" role="tooltip" hidden></div>
            </div>
          </div>
        </section>
        <div class="trajectory-load-earlier" hidden>
          <button class="trajectory-load-btn" type="button">加载更早的历史</button>
        </div>
        <div id="trajectory-ledger" role="table" aria-label="轨迹事件记录表"></div>
      </div>
    </div>

    <!-- Composer -->
    <div id="composer-wrap">
      <!-- 运行状态条(Mac RunningStatusRow):悬浮在输入框区域顶部,不占记录流的行 -->
      <div id="running-status" hidden></div>
      <!-- 回到底部(对齐 web ChatView toBottom):读者上滚离开底部时出现,点了落底并恢复跟随 -->
      <button id="scroll-to-bottom" type="button" hidden aria-label="滚动到底部" title="滚动到底部">
        <!-- lucide: chevron-down -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <ol id="prompt-queue" hidden aria-live="polite" aria-label="排队消息"></ol>

      <!-- 会话停靠区:目标条 / 待办 / 上下文与统计 -->
      <div id="goal-bar-slot" hidden></div>
      <div id="todo-panel" hidden></div>

      <!-- 交互接管区:审批/提问/计划审阅卡挂在这里,挂载时输入框被隐藏 -->
      <div id="composer-takeover" hidden></div>

      <div id="composer">
        <!-- 图片预览条 -->
        <div id="preview-strip"></div>

        <!-- 已选取的页面元素 -->
        <!-- 药丸本身是容器而非按钮:清空键要住在药丸里,而按钮不能嵌套按钮,
             所以边框/底色画在 .picked-pill 上,里面并排放"展开"与"清空"两颗。 -->
        <div id="picked-elements-chip" hidden>
          <div class="picked-pill">
            <button id="picked-elements-trigger" type="button" popovertarget="picked-elements-menu">
              <span class="picked-dot" aria-hidden="true"></span>
              <span id="picked-elements-label">已选取 0 个元素</span>
              <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <button id="picked-elements-clear" type="button" aria-label="清空已选元素" title="清空已选元素"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
          </div>
          <div id="picked-elements-menu" popover="auto" aria-label="已选取的元素"></div>
        </div>

        <!-- 主输入。引用胶囊由 #input-mirror 画在 textarea 底下:
             textarea 画不了行内元素,故正文透明、镜像层负责显示。 -->
        <div id="input-wrap">
          <div id="input-mirror" aria-hidden="true"></div>
          <textarea id="input" rows="1" placeholder="发送消息…(Shift+Enter 换行)" aria-label="Message input"></textarea>
        </div>

        <!-- 底部控件行 -->
        <!-- "/" 与 "@" 触发候选菜单(锚在输入框上方) -->
        <div id="trigger-menu" hidden role="listbox" aria-label="候选"></div>

        <div id="composer-bar">
          <!-- 加号按钮:打开的就是输入 "@" 时那个候选浮层(#trigger-menu) -->
          <button class="bar-btn" id="attach-btn" type="button" aria-label="添加上下文"
                  aria-haspopup="listbox" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button>

          <!-- 页面元素选取:在当前网页上圈选元素,发送时随消息附上定位信息 -->
          <button class="bar-btn state-off" id="element-picker-btn" type="button" aria-pressed="false" aria-label="选取页面元素">
            <!-- lucide: square-dashed-mouse-pointer -->
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12.034 12.681a.498.498 0 0 1 .647-.647l9 3.5a.5.5 0 0 1-.033.943l-3.444 1.068a1 1 0 0 0-.66.66l-1.067 3.443a.5.5 0 0 1-.943.033z"/>
              <path d="M5 3a2 2 0 0 0-2 2"/><path d="M19 3a2 2 0 0 1 2 2"/><path d="M5 21a2 2 0 0 1-2-2"/>
              <path d="M9 3h1"/><path d="M9 21h2"/><path d="M14 3h1"/>
              <path d="M3 9v1"/><path d="M21 9v2"/><path d="M3 14v1"/>
            </svg>
          </button>

          <!-- plan mode 药丸:仅在计划模式开启时显示,点击执行 /plan off -->
          <button class="bar-btn plan-chip" id="plan-chip" type="button" hidden>
            <span class="plan-chip-label">Plan</span><span class="plan-chip-x" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></span>
          </button>

          <!-- 技能/命令候选菜单:仅由输入框的 "/" 触发,底栏不再放入口按钮 -->
          <div id="skills-menu" popover="auto" aria-label="Skills"></div>

          <button class="bar-btn" id="perm-btn" type="button" popovertarget="perm-menu">
            <span id="perm-label">—</span>
            <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m6 9 6 6 6-6"/>
            </svg>
          </button>
          <div id="perm-menu" popover="auto" aria-label="权限模式"></div>

          <div id="model-picker">
            <button class="bar-btn" id="model-btn" type="button" popovertarget="model-menu" aria-label="Select model">
              <span id="model-label">—</span>
              <svg class="dropdown-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="m6 9 6 6 6-6"/>
              </svg>
            </button>
            <div id="model-menu" popover="auto" aria-label="Select model"></div>
          </div>

          <!-- 统计/上下文:底栏药丸触发,点击弹出详情(对齐 Mac JobListAction 的 trigger→popover)-->
          <button class="bar-btn" id="stats-btn" type="button" popovertarget="stats-menu" hidden>
            <span class="stats-ring" aria-hidden="true"></span>
          </button>
          <div id="stats-menu" popover="auto" aria-label="上下文与统计"></div>

          <button id="send" class="state-idle" disabled aria-label="Send"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></button>
        </div>
      </div>
    </div>

    <!-- file input(隐藏) -->
    <input id="file-input" type="file" multiple hidden />

  </div>

  <section id="management-surface" hidden aria-labelledby="management-title">
    <div id="management-header">
      <button id="management-back" class="hdr-btn" type="button" aria-label="返回会话"></button>
      <h1 id="management-title"></h1>
    </div>
    <div id="management-content"></div>
  </section>

  <!-- 会话 turn 轨道:浮在消息区右缘的轮次刻度,由 turn-rail-view 渲染 -->
  <div id="turn-rail" hidden aria-label="轮次导航"></div>

  <!-- ── 会话抽屉(从左侧滑入,对齐 Mac 的左侧栏) ──
       住在 body 层而不是 header 里:它要盖住整个侧栏的高度,而 header 只有 42px,
       做它的子节点就只能在那条窄带里滑动。遮罩单独一层,点它即关。 -->
  <div id="session-drawer-scrim" hidden></div>
  <aside id="session-drawer" role="dialog" aria-label="会话" aria-modal="false">
    <div id="history-search-wrap">
      <!-- lucide: search -->
      <svg id="history-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="m21 21-4.34-4.34"/>
        <circle cx="11" cy="11" r="8"/>
      </svg>
      <input id="history-search" type="text" placeholder="搜索历史…" autocomplete="off" spellcheck="false" />
      <button class="hdr-btn" id="session-drawer-close" type="button" aria-label="关闭会话列表" title="关闭会话列表">
        <!-- lucide: panel-left-close 的简化:一条竖线 + 左箭头 -->
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
        </svg>
      </button>
    </div>
    <!-- 置顶区 / 分区标题(含视图选项与添加目录)/ 分组 / 会话行,全部由
         session-drawer-view.js 画进这一个 <ul> —— 它们共享同一条滚动与
         同一套键盘导航,拆成几个容器反而会把滚动切成几段。 -->
    <nav id="history-navigation" aria-label="管理页面">
      <button id="history-new-btn" class="history-navigation-btn" type="button"><span data-navigation-label>新会话</span></button>
      <button class="history-navigation-btn" type="button" data-main-surface="plugins"><span data-navigation-label>插件</span></button>
      <button class="history-navigation-btn" type="button" data-main-surface="automations"><span data-navigation-label>自动化任务</span></button>
    </nav>
    <ul id="history-list-inner" role="list"></ul>
    <button id="history-settings-btn" class="history-navigation-btn" type="button"><span data-navigation-label>设置</span></button>
  </aside>

  <div id="toast" hidden></div>

  <!-- full-access 权限二次确认 -->
  <dialog id="perm-confirm">
    <h2 id="perm-confirm-title">启用完全访问?</h2>
    <p id="perm-confirm-body">Agent 将可以不经询问地读写任意文件、执行任意命令。只在你信任当前任务时启用。</p>
    <label class="toggle-row">
      <input id="perm-confirm-ack" type="checkbox" />
      <span id="perm-confirm-ack-label">我已了解风险</span>
    </label>
    <div class="dialog-actions">
      <button class="btn" id="perm-confirm-cancel" type="button">取消</button>
      <button class="btn primary" id="perm-confirm-enable" type="button" disabled>启用</button>
    </div>
  </dialog>

  <!-- ── 设置视图(全屏覆盖)。前五个 pane 照搬 Mac Settings:
       通用 / 模型 / Agent 预设 / 插件 / 服务端;第六个「快捷键」是命令表的只读视图。
       tab 条是 role="tablist",每个 pane 的内容由 JS 渲染进 .settings-pane。 ── -->
  <div id="view-settings">
    <div id="settings-header">
      <button id="settings-back" aria-label="Back"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
      <span id="settings-title">设置</span>
    </div>
    <!-- 文案与图标分开:文案在 .settings-tab-label 里由 JS 按语言填,图标在同一按钮
         里由 JS 建一次(svg 不能靠 textContent 换)。两者缺一都只是少画一部分,
         不影响切换。 -->
    <div id="settings-tabs" role="tablist" aria-label="设置分区">
      <button class="settings-tab" type="button" role="tab" id="settings-tab-general"
              data-tab="general" aria-controls="settings-pane-general" aria-selected="true"><span class="settings-tab-label">通用设置</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-models"
              data-tab="models" aria-controls="settings-pane-models" aria-selected="false"><span class="settings-tab-label">模型</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-presets"
              data-tab="presets" aria-controls="settings-pane-presets" aria-selected="false"><span class="settings-tab-label">Agent 预设</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-plugins"
              data-tab="plugins" aria-controls="settings-pane-plugins" aria-selected="false"><span class="settings-tab-label">内置插件</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-mobile"
              data-tab="mobile" aria-controls="settings-pane-mobile" aria-selected="false"><span class="settings-tab-label">移动端访问</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-browser"
              data-tab="browser" aria-controls="settings-pane-browser" aria-selected="false"><span class="settings-tab-label">浏览器</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-server"
              data-tab="server" aria-controls="settings-pane-server" aria-selected="false"><span class="settings-tab-label">DSH Server</span></button>
      <button class="settings-tab" type="button" role="tab" id="settings-tab-shortcuts"
              data-tab="shortcuts" aria-controls="settings-pane-shortcuts" aria-selected="false"><span class="settings-tab-label">快捷键</span></button>
    </div>
    <div id="settings-body">
      <!-- 通用:照搬 Mac 通用 pane 的行序,整段由 JS 渲染。
           后端地址与 CDP 桥都不在这里:后端地址在服务端页,CDP 桥(谁能控制这个
           浏览器)在浏览器页。 -->
      <section class="settings-pane" id="settings-pane-general" role="tabpanel"
               aria-labelledby="settings-tab-general">
        <!-- 由 JS 渲染:Agent 预设 / 权限 / 语言 / 外观 / 通知 / Enter 行为 / 配置文件 -->
        <div id="set-general-host"></div>
      </section>
      <section class="settings-pane" id="settings-pane-models" role="tabpanel"
               aria-labelledby="settings-tab-models" hidden></section>
      <section class="settings-pane" id="settings-pane-presets" role="tabpanel"
               aria-labelledby="settings-tab-presets" hidden></section>
      <section class="settings-pane" id="settings-pane-plugins" role="tabpanel"
               aria-labelledby="settings-tab-plugins" hidden></section>
      <!-- 移动端访问:中转状态 / 已配对的手机 / 配对二维码,整段由 JS 渲染(mobile-pane.js)。 -->
      <section class="settings-pane" id="settings-pane-mobile" role="tabpanel"
               aria-labelledby="settings-tab-mobile" hidden></section>
      <!-- 浏览器:Agent 浏览器控制(CDP 桥)状态 + 网页搜索开关与搜索引擎,整段由 JS 渲染(browser-pane.js)。 -->
      <section class="settings-pane" id="settings-pane-browser" role="tabpanel"
               aria-labelledby="settings-tab-browser" hidden></section>
      <!-- 快捷键:命令表的只读视图,不碰宿主设置,整段由 JS 渲染。 -->
      <section class="settings-pane" id="settings-pane-shortcuts" role="tabpanel"
               aria-labelledby="settings-tab-shortcuts" hidden></section>
      <section class="settings-pane" id="settings-pane-server" role="tabpanel"
               aria-labelledby="settings-tab-server" hidden>
        <!-- 整页由 JS 渲染(server-pane.js)。 -->
        <div id="set-server-host"></div>
      </section>
    </div>
  </div>

  <!-- 设置页里的模态:提供方编辑器 / 自定义提供方 / 预设查看 / 复制预设 / 确认 -->
  <dialog id="settings-sheet">
    <div id="settings-sheet-body"></div>
  </dialog>

  <!-- 首次使用:连上 dsh 但还没有任何可用的模型提供方时,引导填 DeepSeek 官方
       API Key(对齐 Mac DeepSeekOnboardingDialog)。内容由 api-key-onboarding.js 渲染。 -->
  <dialog id="key-onboarding" aria-labelledby="key-onb-title"></dialog>

  <!-- 拖放落点提示。覆盖整个侧栏,所以挂在 body 层而不是 composer 内。
       pointer-events: none —— 它自己不能吃掉 drop 事件,事件由 body 上的监听接。 -->
  <div id="drop-overlay" hidden aria-hidden="true">
    <div class="drop-overlay-card">
      <!-- lucide: image-plus -->
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 5h6"/><path d="M19 2v6"/>
        <path d="M21 11.5V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7.5"/>
        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
        <circle cx="9" cy="9" r="2"/>
      </svg>
      <span id="drop-overlay-hint">拖入图片、文件或文件夹</span>
    </div>
  </div>

  <script type="module" src="../../src/entries/sidepanel.js"></script>
</body>
</html>
